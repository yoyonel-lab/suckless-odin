# Ruff Python Linter & Formatter Configuration

# Target Python version
target-version = "py310"

# Target line length (standard modern style)
line-length = 120

[lint]
# Select rule classes to enforce:
# - E, W: pycodestyle errors and warnings
# - F: Pyflakes logical checks
# - I: isort import statement sorting
# - B: flake8-bugbear common bugs and design patterns
# - C90: McCabe code complexity analyzer
# - N: PEP 8 naming convention checks
# - UP: pyupgrade modern syntax upgrades
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "C90",
    "N",
    "UP",
]

ignore = []

[lint.mccabe]
max-complexity = 20
