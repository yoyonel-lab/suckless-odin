name: "Setup Windows Dependencies"
description: "Installs Windows toolchain, downloads pre-built Windows libraries and sets up Odin vendor dependencies"
inputs:
  with-packaging:
    description: "Install additional packaging tools (zstd, zip, rsync, imagemagick)"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for setup-task"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Windows toolchain & Wine
      uses: ./.github/actions/setup-windows-toolchain
      with:
        with-packaging: ${{ inputs.with-packaging }}
        github-token: ${{ inputs.github-token }}

    - name: Download Windows Dependencies Artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-deps

    - name: Restore Windows Dependencies to Odin Root
      shell: bash
      run: bash scripts/ci/install_win_deps.sh
